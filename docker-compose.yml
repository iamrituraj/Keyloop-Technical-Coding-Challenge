services:
  keyloop-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyloop-unified-scheduler
    ports:
      - "5001:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/scheduler.db;Cache=Shared
    volumes:
      - ./data:/app/data
    restart: unless-stopped
